name: .NET

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    env:
      # The NTS submodule derives its version build-metadata from
      # ci.github.$(GITHUB_ACTION); GitHub sets GITHUB_ACTION to "__run" for
      # inline run: steps, and the underscores make an invalid SemVer
      # (e.g. 2.4.0-pre...+ci.github.__run) that the modern NuGet rejects.
      # Override the metadata with an underscore-free value.
      NtsBuildMetadata: ci.local

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      # The NetTopologySuite submodule's NuGet.config lists only the dotnet-eng
      # Azure DevOps feed (which 403s outside Microsoft's network) and pulls the
      # legacy Microsoft.DotNet.ApiCompat package. Restore from nuget.org and
      # disable ApiCompat (the modern SDK ships it built-in).
      run: dotnet restore NetTopologySuite.Curve.sln -p:EnableApiCompat=false --source https://api.nuget.org/v3/index.json
    - name: Build
      run: dotnet build NetTopologySuite.Curve.sln --no-restore -p:EnableApiCompat=false
    - name: Test
      run: dotnet test test/NetTopologySuite.Curved.Test/NetTopologySuite.Curve.Test.csproj --no-build -p:EnableApiCompat=false --verbosity normal
