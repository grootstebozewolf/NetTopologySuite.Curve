name: .NET

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macOS-latest ]

    steps:
    - name: Get source
      uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10

    - name: Restore
      run: dotnet restore -p:EnableApiCompat=false

    - name: Build
      run: dotnet build -c Release --no-restore -p:EnableApiCompat=false

    - name: Test
      # --blame-hang-timeout surfaces hung tests as failures instead of
      # letting them block CI forever; some Curve* tests on this branch
      # are known to hang and need follow-up TAG fixes.
      run: dotnet test -c Release --no-build -p:EnableApiCompat=false --blame-hang-timeout 120s
